<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duriano Tracker | Player Statistics</title>
    <!-- Bootstrap 5.3 Dark Mode -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bs-body-bg: #0f1115;
            --bs-body-color: #dee2e6;
            --card-bg: #16191d;
            --accent-color: #ffd700;
            /* Gold */
            --diff-normal: #6c757d;
            --diff-hard: #aab2bd;
            --diff-hell: #ffc107;
            --diff-duriano: #dc3545;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bs-body-bg);
        }

        .navbar {
            background-color: #16191d;
            border-bottom: 1px solid #2d3238;
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent-color) !important;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #2d3238;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
        }

        /* Table Styles */
        .table-container {
            background-color: var(--card-bg);
            border: 1px solid #2d3238;
            border-radius: 8px;
            overflow: hidden;
        }

        .table {
            --bs-table-bg: transparent;
            margin-bottom: 0;
        }

        .table th {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #2d3238;
            cursor: pointer;
            user-select: none;
        }

        .table th:hover {
            color: var(--accent-color);
        }

        .table td {
            vertical-align: middle;
            border-color: #2d3238;
            font-size: 0.95rem;
        }

        .player-id {
            font-family: 'JetBrains Mono', monospace;
            color: #a5d6ff;
            font-size: 0.9em;
        }

        .win-rate-bar {
            height: 6px;
            background-color: #2d3238;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }

        .win-rate-fill {
            height: 100%;
            background-color: var(--accent-color);
        }

        /* Platform Icons */
        .platform-icon {
            color: #8b949e;
        }

        /* Difficulty Badges */
        .diff-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            display: inline-block;
            min-width: 30px;
            text-align: center;
        }

        .diff-badge.normal {
            color: var(--diff-normal);
            border: 1px solid var(--diff-normal);
        }

        .diff-badge.hard {
            color: var(--diff-hard);
            border: 1px solid var(--diff-hard);
        }

        .diff-badge.hell {
            color: var(--diff-hell);
            border: 1px solid var(--diff-hell);
        }

        .diff-badge.duriano {
            color: var(--diff-duriano);
            border: 1px solid var(--diff-duriano);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f1115;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d3238;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444c56;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fas fa-crown me-2"></i>DURIANO TRACKER</a>
            <div class="d-flex align-items-center gap-3">
                <select id="version-select" class="form-select form-select-sm bg-dark text-light border-secondary"
                    style="width: 200px;">
                    <option value="loading">Loading versions...</option>
                </select>
                <button id="refresh-btn" class="btn btn-sm btn-outline-warning">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">

        <!-- Alerts -->
        <div id="alert-container"></div>

        <!-- Global Stats -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card h-100 p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="stat-label">Unique Players</span>
                        <i class="fas fa-users text-muted"></i>
                    </div>
                    <div class="stat-value" id="stat-players">-</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card h-100 p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="stat-label">Total Runs</span>
                        <i class="fas fa-gamepad text-muted"></i>
                    </div>
                    <div class="stat-value" id="stat-runs">-</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card h-100 p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="stat-label">Global Win Rate</span>
                        <i class="fas fa-trophy text-muted"></i>
                    </div>
                    <div class="stat-value text-warning" id="stat-winrate">-</div>
                    <small class="text-muted" id="stat-win-loss"></small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card h-100 p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="stat-label">Most Played Diff</span>
                        <i class="fas fa-chart-bar text-muted"></i>
                    </div>
                    <div class="stat-value" id="stat-fav-diff">-</div>
                </div>
            </div>
        </div>

        <!-- Difficulty Detailed Stats -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card h-100 p-3" style="border-left: 4px solid var(--diff-normal);">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="stat-label text-light">Normal</span>
                        <i class="fas fa-user text-muted"></i>
                    </div>
                    <div class="stat-value fs-4" id="stat-normal-runs">-</div>
                    <small class="text-muted" id="stat-normal-wr">-</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card h-100 p-3" style="border-left: 4px solid var(--diff-hard);">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="stat-label text-light">Hard</span>
                        <i class="fas fa-skull text-muted"></i>
                    </div>
                    <div class="stat-value fs-4" id="stat-hard-runs">-</div>
                    <small class="text-muted" id="stat-hard-wr">-</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card h-100 p-3" style="border-left: 4px solid var(--diff-hell);">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="stat-label text-light">Hell</span>
                        <i class="fas fa-fire text-muted"></i>
                    </div>
                    <div class="stat-value fs-4" id="stat-hell-runs">-</div>
                    <small class="text-muted" id="stat-hell-wr">-</small>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card h-100 p-3" style="border-left: 4px solid var(--diff-duriano);">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="stat-label text-light">Duriano</span>
                        <i class="fas fa-dragon text-muted"></i>
                    </div>
                    <div class="stat-value fs-4" id="stat-duriano-runs">-</div>
                    <small class="text-muted" id="stat-duriano-wr">-</small>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row g-4 mb-4">
            <div class="col-md-6 col-lg-3">
                <div class="card h-100 p-3">
                    <h6 class="card-title text-muted mb-3">Runs by Difficulty</h6>
                    <div style="height: 250px; position: relative;">
                        <canvas id="runsChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="card h-100 p-3">
                    <h6 class="card-title text-muted mb-3">Runs by Platform</h6>
                    <div style="height: 250px; position: relative;">
                        <canvas id="platformChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-12 col-lg-6">
                <div class="card h-100 p-3">
                    <h6 class="card-title text-muted mb-3">Survival Rates (Alive vs Dead)</h6>
                    <div style="height: 250px; position: relative;">
                        <canvas id="survivalChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="table-container">
            <div
                class="p-3 border-bottom border-secondary d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div class="input-group" style="max-width: 400px;">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i
                            class="fas fa-search"></i></span>
                    <input type="text" id="search-input" class="form-control bg-dark border-secondary text-light"
                        placeholder="Search Player ID...">
                </div>
                <div class="text-muted small">
                    <span id="last-updated"></span>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th scope="col" class="sortable" data-sort="playerName">Player ID <i
                                    class="fas fa-sort float-end mt-1"></i></th>
                            <th scope="col" class="text-center sortable" data-sort="Platform">Plat <i
                                    class="fas fa-sort float-end mt-1"></i></th>
                            <th scope="col" class="text-center sortable" data-sort="count">Runs <i
                                    class="fas fa-sort float-end mt-1"></i></th>
                            <th scope="col" class="sortable" style="width: 150px;" data-sort="winRate">Win Rate <i
                                    class="fas fa-sort float-end mt-1"></i></th>
                            <th scope="col" class="text-center sortable" data-sort="Normal">Normal <i
                                    class="fas fa-sort float-end mt-1"></i></th>
                            <th scope="col" class="text-center sortable" data-sort="Hard">Hard <i
                                    class="fas fa-sort float-end mt-1"></i></th>
                            <th scope="col" class="text-center sortable" data-sort="Hell">Hell <i
                                    class="fas fa-sort float-end mt-1"></i></th>
                            <th scope="col" class="text-center sortable" data-sort="Duriano">Duriano <i
                                    class="fas fa-sort float-end mt-1"></i></th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
            <div id="no-results" class="text-center py-5 d-none">
                <i class="fas fa-ghost fa-3x text-muted mb-3"></i>
                <p class="text-muted">No players found.</p>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // --- Configuration & State ---
        let availableFiles = [];
        let rawData = [];
        let filteredData = [];
        let sortState = { key: 'count', dir: 'desc' };
        let charts = { runs: null, survival: null, platform: null };

        const DIFF_COLORS = {
            Normal: '#6c757d',
            Hard: '#aab2bd',
            Hell: '#ffc107',
            Duriano: '#dc3545'
        };

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', async () => {
            await initVersions();
            setupEvents();
        });

        async function initVersions() {
            try {
                const res = await fetch(`metadata.json?t=${Date.now()}`);
                if (!res.ok) throw new Error('Metadata missing');
                const meta = await res.json();

                availableFiles = meta;
                const select = document.getElementById('version-select');
                select.innerHTML = '<option value="all">All Versions (Combined)</option>';

                meta.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.file;
                    opt.textContent = m.label;
                    select.appendChild(opt);
                });

                // Default to latest single version or all? Let's default to All for big picture, 
                // or the latest file (index 0) if preferred. Let's do index 0 (latest version).
                if (meta.length > 0) {
                    select.value = meta[0].file;
                    loadData(meta[0].file);
                }
            } catch (err) {
                showAlert('Failed to init: ' + err.message, 'danger');
            }
        }

        function setupEvents() {
            document.getElementById('version-select').addEventListener('change', (e) => loadData(e.target.value));
            document.getElementById('refresh-btn').addEventListener('click', () => {
                loadData(document.getElementById('version-select').value);
            });
            document.getElementById('search-input').addEventListener('input', (e) => {
                applyFilter(e.target.value);
            });

            document.querySelectorAll('th.sortable').forEach(th => {
                th.addEventListener('click', () => {
                    const key = th.dataset.sort;
                    handleSort(key);
                });
            });
        }

        // --- Data Loading ---
        async function loadData(source) {
            const btn = document.getElementById('refresh-btn');
            btn.classList.add('disabled');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                let data = [];
                let timestamp = '';

                if (source === 'all') {
                    // Fetch all and merge
                    const promises = availableFiles.map(f => fetch(`${f.file}?t=${Date.now()}`).then(r => r.json()));
                    const results = await Promise.all(promises);
                    const merged = new Map();

                    results.forEach(res => {
                        if (res.timestamp > timestamp) timestamp = res.timestamp;
                        (res.data || []).forEach(p => {
                            if (merged.has(p.playerName)) {
                                mergePlayer(merged.get(p.playerName), p);
                            } else {
                                merged.set(p.playerName, deepClone(p));
                            }
                        });
                    });
                    data = Array.from(merged.values());
                    timestamp = `Merged (Latest: ${timestamp})`;
                } else {
                    const res = await fetch(`${source}?t=${Date.now()}`);
                    if (!res.ok) throw new Error(`Failed to load ${source}`);
                    const json = await res.json();
                    data = json.data || [];
                    timestamp = json.timestamp;
                }

                // Pre-calculate win rates for sorting
                data.forEach(p => {
                    p.winRate = p.count > 0 ? (p.Alive / p.count) : 0;
                });

                rawData = data;
                document.getElementById('last-updated').textContent = timestamp;

                updateStats();
                updateCharts();
                applyFilter(document.getElementById('search-input').value);

            } catch (err) {
                console.error(err);
                showAlert(`Error loading data: ${err.message}`, 'danger');
            } finally {
                btn.classList.remove('disabled');
                btn.innerHTML = '<i class="fas fa-sync-alt"></i>';
            }
        }

        function mergePlayer(target, source) {
            target.count += (source.count || 0);
            target.Alive += (source.Alive || 0);
            target.Dead += (source.Dead || 0);
            target.Normal += (source.Normal || 0);
            target.Hard += (source.Hard || 0);
            target.Hell += (source.Hell || 0);
            target.Duriano += (source.Duriano || 0);

            // Platform (Merge counts)
            if (source.Platform) {
                if (!target.Platform) target.Platform = {};
                Object.keys(source.Platform).forEach(k => {
                    target.Platform[k] = (target.Platform[k] || 0) + source.Platform[k];
                });
            }

            // Merge nested byDifficulty
            if (source.byDifficulty) {
                if (!target.byDifficulty) target.byDifficulty = {};
                ['Normal', 'Hard', 'Hell', 'Duriano'].forEach(d => {
                    if (source.byDifficulty[d]) {
                        if (!target.byDifficulty[d]) {
                            target.byDifficulty[d] = { ...source.byDifficulty[d] };
                        } else {
                            target.byDifficulty[d].Alive += (source.byDifficulty[d].Alive || 0);
                            target.byDifficulty[d].Dead += (source.byDifficulty[d].Dead || 0);
                            target.byDifficulty[d].Total += (source.byDifficulty[d].Total || 0);
                        }
                    }
                });
            }
        }

        function deepClone(obj) {
            // Basic deep clone, also handling byDifficulty structure
            const newObj = JSON.parse(JSON.stringify(obj));
            // Ensure byDifficulty is clean if it exists
            if (newObj.byDifficulty) {
                // It's already cloned by JSON.parse/stringify, just ensuring it's there
            } else {
                newObj.byDifficulty = {};
            }
            return newObj;
        }

        // --- Rendering ---
        function updateStats() {
            const totalPlayers = rawData.length;
            const totalRuns = rawData.reduce((s, p) => s + p.count, 0);
            const totalAlive = rawData.reduce((s, p) => s + p.Alive, 0);
            const winRate = totalRuns ? ((totalAlive / totalRuns) * 100).toFixed(1) : 0;

            document.getElementById('stat-players').textContent = totalPlayers;
            document.getElementById('stat-runs').textContent = totalRuns;
            document.getElementById('stat-winrate').textContent = winRate + '%';
            document.getElementById('stat-win-loss').textContent = `${totalAlive} W - ${totalRuns - totalAlive} L`;

            // Difficulty Breakdown & Favorite
            const diffs = { Normal: 0, Hard: 0, Hell: 0, Duriano: 0 };
            const modeStats = {
                Normal: { runs: 0, wins: 0 },
                Hard: { runs: 0, wins: 0 },
                Hell: { runs: 0, wins: 0 },
                Duriano: { runs: 0, wins: 0 }
            };

            rawData.forEach(p => {
                // Total Runs per diff
                diffs.Normal += p.Normal || 0;
                diffs.Hard += p.Hard || 0;
                diffs.Hell += p.Hell || 0;
                diffs.Duriano += p.Duriano || 0;

                // Win Rate Stats (requires byDifficulty)
                if (p.byDifficulty) {
                    ['Normal', 'Hard', 'Hell', 'Duriano'].forEach(d => {
                        if (p.byDifficulty[d]) {
                            modeStats[d].runs += p.byDifficulty[d].Total || 0;
                            modeStats[d].wins += p.byDifficulty[d].Alive || 0;
                        } else {
                            // Fallback if detail missing but count exists in root (assume 0 wins or just track runs)
                            // Ideally root count should match byDifficulty total, but safely add runs from root if byDiff missing?
                            // Actually, let's stick to root counts for total runs consistency
                        }
                    });
                }
            });

            // Update Mode Cards
            ['Normal', 'Hard', 'Hell', 'Duriano'].forEach(mode => {
                // Use root counts (diffs) for total runs to be safe
                const runs = diffs[mode];
                const wins = modeStats[mode].wins; // Wins must come from detailed stats
                // If detailed stats missing, wins might be undercounted. 

                const wr = runs > 0 ? ((wins / runs) * 100).toFixed(1) + '%' : '0%';

                document.getElementById(`stat-${mode.toLowerCase()}-runs`).textContent = runs > 0 ? `${runs} Runs` : '-';
                document.getElementById(`stat-${mode.toLowerCase()}-wr`).textContent = runs > 0 ? `${wr} WR` : '-';
            });


            // Handle case where no runs exist to avoid reduce error
            let fav = 'None';
            if (Object.values(diffs).some(v => v > 0)) {
                fav = Object.keys(diffs).reduce((a, b) => diffs[a] > diffs[b] ? a : b);
            }

            const favEl = document.getElementById('stat-fav-diff');
            favEl.textContent = fav;
            favEl.style.color = DIFF_COLORS[fav] || '#fff';
        }

        function updateCharts() {
            const diffs = { Normal: 0, Hard: 0, Hell: 0, Duriano: 0 };
            const survival = {
                Normal: { alive: 0, dead: 0 },
                Hard: { alive: 0, dead: 0 },
                Hell: { alive: 0, dead: 0 },
                Duriano: { alive: 0, dead: 0 }
            };
            const platformStats = { Windows: 0, macOS: 0, Linux: 0, Android: 0, iOS: 0, Unknown: 0 };

            rawData.forEach(p => {
                // Difficulty Stats
                diffs.Normal += p.Normal || 0;
                diffs.Hard += p.Hard || 0;
                diffs.Hell += p.Hell || 0;
                diffs.Duriano += p.Duriano || 0;

                // Survival Stats
                if (p.byDifficulty) {
                    ['Normal', 'Hard', 'Hell', 'Duriano'].forEach(d => {
                        if (p.byDifficulty[d]) {
                            survival[d].alive += p.byDifficulty[d].Alive || 0;
                            survival[d].dead += p.byDifficulty[d].Dead || 0;
                        }
                    });
                }

                // Platform Stats
                if (p.Platform) {
                    let hasPlatform = false;
                    if (p.Platform.WindowsPlayer) { platformStats.Windows += p.Platform.WindowsPlayer; hasPlatform = true; }
                    if (p.Platform.OSXPlayer) { platformStats.macOS += p.Platform.OSXPlayer; hasPlatform = true; }
                    if (p.Platform.LinuxPlayer) { platformStats.Linux += p.Platform.LinuxPlayer; hasPlatform = true; }
                    if (p.Platform.Android) { platformStats.Android += p.Platform.Android; hasPlatform = true; }
                    if (p.Platform.IPhonePlayer) { platformStats.iOS += p.Platform.IPhonePlayer; hasPlatform = true; }
                    
                    if (!hasPlatform) platformStats.Unknown += (p.count || 0);
                } else {
                    platformStats.Unknown += (p.count || 0);
                }
            });

            // Destroy old
            if (charts.runs) charts.runs.destroy();
            if (charts.survival) charts.survival.destroy();
            if (charts.platform) charts.platform.destroy();

            // Chart Defaults
            Chart.defaults.color = '#8b949e';
            Chart.defaults.borderColor = '#2d3238';

            // Runs Chart
            const ctxRuns = document.getElementById('runsChart').getContext('2d');
            charts.runs = new Chart(ctxRuns, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(diffs),
                    datasets: [{
                        data: Object.values(diffs),
                        backgroundColor: Object.values(DIFF_COLORS),
                        borderWidth: 0
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right' } }
                }
            });

            // Platform Chart
            const ctxPlat = document.getElementById('platformChart').getContext('2d');
            // Filter out zero values for cleaner chart
            const platLabels = Object.keys(platformStats).filter(k => platformStats[k] > 0);
            const platData = platLabels.map(k => platformStats[k]);
            const platColors = {
                Windows: '#0d6efd',
                macOS: '#e2e6ea',
                Linux: '#fd7e14',
                Android: '#198754',
                iOS: '#6610f2',
                Unknown: '#343a40'
            };

            charts.platform = new Chart(ctxPlat, {
                type: 'doughnut',
                data: {
                    labels: platLabels,
                    datasets: [{
                        data: platData,
                        backgroundColor: platLabels.map(l => platColors[l]),
                        borderWidth: 0
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right' } }
                }
            });

            // Survival Chart
            const ctxSurv = document.getElementById('survivalChart').getContext('2d');
            charts.survival = new Chart(ctxSurv, {
                type: 'bar',
                data: {
                    labels: Object.keys(survival),
                    datasets: [
                        {
                            label: 'Alive',
                            data: Object.values(survival).map(s => s.alive),
                            backgroundColor: '#2ea043',
                            stack: 'Stack 0'
                        },
                        {
                            label: 'Dead',
                            data: Object.values(survival).map(s => s.dead),
                            backgroundColor: '#da3633',
                            stack: 'Stack 0'
                        }
                    ]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { display: false } },
                        y: { grid: { color: '#2d3238' } }
                    }
                }
            });
        }

        function applyFilter(query) {
            if (!query) filteredData = [...rawData];
            else {
                const lower = query.toLowerCase();
                filteredData = rawData.filter(p => p.playerName.toLowerCase().includes(lower));
            }

            document.getElementById('no-results').classList.toggle('d-none', filteredData.length > 0);

            // Re-apply sort
            const { key, dir } = sortState;
            filteredData.sort((a, b) => {
                let valA = getSortValue(a, key);
                let valB = getSortValue(b, key);
                return (valA < valB ? -1 : 1) * (dir === 'asc' ? 1 : -1);
            });

            renderTable();
        }

        function handleSort(key) {
            if (sortState.key === key) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
            else { sortState.key = key; sortState.dir = 'desc'; }
            applyFilter(document.getElementById('search-input').value);
        }

        function getSortValue(obj, key) {
            if (key === 'Platform') {
                if (!obj.Platform) return '';
                return Object.keys(obj.Platform)[0] || '';
            }
            return obj[key] || 0;
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = filteredData.map(p => {
                const wr = (p.winRate * 100).toFixed(0);
                const wrColor = wr > 50 ? '#2ea043' : (wr > 20 ? '#d29922' : '#da3633');

                // Platform Icons
                let platIcons = [];
                if (p.Platform) {
                    if (p.Platform.WindowsPlayer) platIcons.push('<i class="fab fa-windows text-primary" title="Windows"></i>');
                    if (p.Platform.OSXPlayer) platIcons.push('<i class="fab fa-apple text-secondary" title="macOS"></i>');
                    if (p.Platform.LinuxPlayer) platIcons.push('<i class="fab fa-linux text-warning" title="Linux"></i>');
                    if (p.Platform.Android) platIcons.push('<i class="fab fa-android text-success" title="Android"></i>');
                    if (p.Platform.IPhonePlayer) platIcons.push('<i class="fas fa-mobile-screen text-info" title="iOS"></i>');
                }
                
                const platDisplay = platIcons.length > 0 
                    ? `<div class="d-flex justify-content-center gap-2">${platIcons.join('')}</div>`
                    : '<i class="fas fa-question text-muted" title="Unknown"></i>';

                // Difficulty Badge Helper
                const getDiffBadge = (diffName, total) => {
                    if (!total) return '<span class="text-muted">-</span>';

                    let title = `${diffName}: ${total}`;
                    if (p.byDifficulty && p.byDifficulty[diffName]) {
                        const { Alive, Dead } = p.byDifficulty[diffName];
                        title = `${diffName}\nAlive (Win): ${Alive}\nDead (Loss): ${Dead}`;
                    }

                    return `<span class="diff-badge ${diffName.toLowerCase()}" title="${title}" style="cursor: help;">${total}</span>`;
                };

                return `
                <tr>
                    <td>
                        <div class="player-id" title="${p.playerName}">${p.playerName}</div>
                    </td>
                    <td class="text-center">${platDisplay}</td>
                    <td class="text-center fw-bold text-light">${p.count}</td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="flex-grow-1 win-rate-bar">
                                <div class="win-rate-fill" style="width: ${wr}%; background-color: ${wrColor}"></div>
                            </div>
                            <small class="text-muted" style="width: 35px; text-align: right;">${wr}%</small>
                        </div>
                    </td>
                    <td class="text-center">${getDiffBadge('Normal', p.Normal)}</td>
                    <td class="text-center">${getDiffBadge('Hard', p.Hard)}</td>
                    <td class="text-center">${getDiffBadge('Hell', p.Hell)}</td>
                    <td class="text-center">${getDiffBadge('Duriano', p.Duriano)}</td>
                </tr>
            `}).join('');
        }

        function showAlert(msg, type) {
            const div = document.createElement('div');
            div.className = `alert alert-${type} alert-dismissible fade show`;
            div.innerHTML = `${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
            document.getElementById('alert-container').appendChild(div);
        }
    </script>
</body>

</html>
